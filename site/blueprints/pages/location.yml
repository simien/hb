    width: 1/3

  description:
    label: Description
    type: textarea

  contactBlock:
    label: Contact
    type: headline

  phone:
    label: Phone
    type: tel
    width: 1/2

  email:
    label: Email
    type: text
    width: 1/2

  addressBlock:
    label: Address
    type: headline

  street:
    label: Street
    type: text
    width: 1/2

  suite:
    label: Suite
    type: text
    width: 1/2

  city:
    label: City
    type: text
    width: 1/3

  state:
    label: State
    type: text
    width: 1/3

  zip:
    label: Zip
    type: text
    width: 1/3

  lat:
